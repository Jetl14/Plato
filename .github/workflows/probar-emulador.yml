name: Probar en emulador
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Compilar APK de prueba
        run: |
          python3 data/build_data.py > /dev/null
          python3 web/build.py app/src/main/assets/index.html
          chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash tests/emulador.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
